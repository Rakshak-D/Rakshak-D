<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
<title id="title">Tools of the trade</title>
<desc id="desc">Languages: Python, JavaScript, TypeScript, C++, SQL. AI and LLMs: PyTorch, Hugging Face, LangChain, Ollama, OpenCLIP, scikit-learn. Retrieval and data: ChromaDB, FAISS, PyMuPDF, SQLite, NumPy, Pandas. Apps and tooling: FastAPI, Django, React, Docker, Git, pytest, GitHub Actions, n8n.</desc>
