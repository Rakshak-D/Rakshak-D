<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Hello, I am Rakshak D</title>
<desc id="desc">A bold editorial introduction in ink, cream and citrus, with a hand-drawn R emblem.</desc>
<style>
  .heavy{font-family:Arial,Helvetica,sans-serif;font-weight:900}
  .normal{font-family:Arial,Helvetica,sans-serif}
  .mono{font-family:'Courier New',Courier,monospace}
  .tick{animation:tick 9s linear infinite;transform-origin:925px 216px}
  .wink{animation:wink 4.5s ease-in-out infinite}
  @keyframes tick{to{transform:rotate(360deg)}}
  @keyframes wink{0%,89%,100%{opacity:1}92%,96%{opacity:.08}}
  @media (prefers-reduced-motion:reduce){.tick,.wink{animation:none}}
</style>
